<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="htBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#062b44" />
      <stop offset="100%" stop-color="#020e18" />
    </radialGradient>
    <linearGradient id="htCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38f8d4" />
      <stop offset="100%" stop-color="#1be7ff" />
    </linearGradient>
    <linearGradient id="htCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cf2ae" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- 外底圆环 -->
  <circle cx="16" cy="16" r="15" fill="url(#htBg)" stroke="#38f8d4" stroke-width="1.2" />

  <!-- 轨道虚线与极点 -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(56,248,212,0.45)" stroke-width="0.8" stroke-dasharray="2 1.5" />
  <circle cx="24.5" cy="7.5" r="1.2" fill="#1be7ff" />
  <circle cx="7.5" cy="24.5" r="1.2" fill="#38f8d4" />

  <!-- 海瞳外轮廓：饱满双弧流线眼睛 -->
  <path d="M 4 16 C 8 8, 24 8, 28 16 C 24 24, 8 24, 4 16 Z" fill="rgba(56,248,212,0.18)" stroke="url(#htCyan)" stroke-width="1.8" stroke-linejoin="round" />

  <!-- 虹膜环 -->
  <circle cx="16" cy="16" r="5.5" fill="rgba(4,28,44,0.92)" stroke="#1be7ff" stroke-width="1.2" />

  <!-- 生命核心瞳孔与高光 -->
  <circle cx="16" cy="16" r="3.2" fill="url(#htCore)" />
  <circle cx="14.8" cy="14.8" r="1.1" fill="#ffffff" />
</svg>
