<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海洋守护者 · AI 助手</title>
<link rel="stylesheet" href="/static/css/assistant.css?v=20260806">
</head>
<body>

<div class="container" id="container">

  <!-- ── 左侧：数字人面板 ── -->
  <div class="avatar-panel" id="avatarPanel">
    <div class="particles" id="particles"></div>

    <div class="av-title">海洋守护者</div>
    <p class="av-subtitle">OCEAN GUARDIAN</p>

    <!-- 数字人 SDK 渲染容器 -->
    <div class="av-wrap" id="avatarWrap"></div>

    <!-- 状态指示 -->
    <div class="av-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusTxt">初始化中</span>
    </div>

    <!-- 实时字幕 -->
    <div class="av-caption hidden" id="caption"></div>
  </div>

  <!-- ── 右侧：对话面板 ── -->
  <div class="chat-panel">

    <div class="chat-topbar">
      <h2>海洋守护者</h2>
      <button class="btn-toggle" id="btnToggle">◧ 纯文本</button>
    </div>

    <div class="quick-actions">
      <button class="quick-btn" data-q="塑料袋在海洋中多久能降解？对海洋生物有什么影响？">塑料袋降解周期</button>
      <button class="quick-btn" data-q="什么是幽灵渔网？它对海洋生态系统有哪些危害？">幽灵渔网危害</button>
      <button class="quick-btn" data-q="普通人日常生活中可以做什么来减少海洋塑料污染？">减少海洋塑料</button>
    </div>

    <div class="messages" id="messages">
      <div class="welcome-skeleton" id="welcomeSkeleton">
        <div class="skel-line"></div>
        <div class="skel-line" style="width:65%"></div>
        <div class="skel-line" style="width:45%"></div>
      </div>
    </div>

    <div class="input-area">
      <textarea id="inp" rows="1" placeholder="输入你的问题…" autocomplete="off"
        aria-label="输入问题"></textarea>
      <button class="btn-send" id="btnSend" title="发送 (Enter)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
        </svg>
      </button>
      <button class="btn-stop hidden" id="btnStop">停止</button>
    </div>

  </div>
</div>

<!--
  第三方库说明：
  答辩 / 离线演示前，请将下列库下载至 src/frontend/static/vendor/ 并改为本地路径。
  - marked@13.0.0:   https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js
  - DOMPurify@3.1.6: https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js
-->
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js"></script>
<script src="/static/sdk_integration.js"></script>
<script src="/static/js/assistant.js?v=20260806"></script>
</body>
</html>
