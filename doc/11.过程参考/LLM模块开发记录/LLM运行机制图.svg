<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">海瞳平台 LLM 运行机制</title>
  <desc id="desc">用户提问经过规则判断、知识库检索、模型生成和答案检查，最终显示文字并由数字人播报。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16324f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4b6b83"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#138a8a"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 42px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #5b7285; }
      .section { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #5b7285; }
      .cardTitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 24px; font-weight: 700; fill: #17324d; }
      .cardText { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #496174; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #5b7285; }
      .pill { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 700; }
      .note { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; font-weight: 700; fill: #17324d; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f4f8fb"/>
  <rect x="36" y="30" width="1528" height="920" rx="28" fill="#ffffff" stroke="#d9e6ee" stroke-width="2"/>

  <text x="80" y="92" class="title">海瞳平台 LLM 运行机制</text>
  <text x="80" y="130" class="subtitle">一句话看懂：先判断问题，再查知识和生成答案，最后检查后展示。</text>
  <rect x="1310" y="67" width="190" height="42" rx="21" fill="#e4f5f3"/>
  <circle cx="1340" cy="88" r="7" fill="#138a8a"/>
  <text x="1360" y="95" class="pill" fill="#138a8a">在线问答主流程</text>

  <text x="80" y="192" class="section">输入</text>
  <text x="335" y="192" class="section">判断与检索</text>
  <text x="855" y="192" class="section">模型处理</text>
  <text x="1370" y="192" class="section">输出</text>

  <!-- Main cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="220" height="270" rx="20" fill="#e8f1fb" stroke="#bcd3e8" stroke-width="2"/>
    <rect x="330" y="230" width="220" height="270" rx="20" fill="#fff4df" stroke="#f1d49a" stroke-width="2"/>
    <rect x="590" y="230" width="220" height="270" rx="20" fill="#e5f6f3" stroke="#addfd9" stroke-width="2"/>
    <rect x="850" y="230" width="220" height="270" rx="20" fill="#e9e7fb" stroke="#c4c0eb" stroke-width="2"/>
    <rect x="1110" y="230" width="220" height="270" rx="20" fill="#fff0ec" stroke="#efc3b8" stroke-width="2"/>
    <rect x="1370" y="230" width="160" height="270" rx="20" fill="#e9f6e9" stroke="#b9dfbb" stroke-width="2"/>
  </g>

  <!-- Card 1 -->
  <circle cx="110" cy="274" r="24" fill="#3679b9"/>
  <text x="110" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#fff">1</text>
  <text x="150" y="282" class="cardTitle">用户提问</text>
  <text x="95" y="335" class="cardText">前端收集：</text>
  <text x="95" y="369" class="cardText">• 当前问题</text>
  <text x="95" y="401" class="cardText">• 历史对话</text>
  <text x="95" y="433" class="cardText">• 会话编号</text>
  <rect x="95" y="455" width="170" height="28" rx="14" fill="#d4e6f6"/>
  <text x="180" y="475" text-anchor="middle" class="pill" fill="#3679b9">SSE 流式请求</text>

  <!-- Card 2 -->
  <circle cx="370" cy="274" r="24" fill="#d98a19"/>
  <text x="370" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#fff">2</text>
  <text x="410" y="282" class="cardTitle">先看规则</text>
  <text x="355" y="335" class="cardText">身份、法规、</text>
  <text x="355" y="367" class="cardText">高风险问题先由</text>
  <text x="355" y="399" class="cardText">固定答案处理。</text>
  <rect x="350" y="434" width="180" height="34" rx="17" fill="#ffe4b2"/>
  <text x="440" y="457" text-anchor="middle" class="pill" fill="#a9620c">简单问题：直接回答</text>

  <!-- Card 3 -->
  <circle cx="630" cy="274" r="24" fill="#138a8a"/>
  <text x="630" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#fff">3</text>
  <text x="670" y="282" class="cardTitle">查知识库</text>
  <text x="615" y="335" class="cardText">从 27 篇海洋知识</text>
  <text x="615" y="367" class="cardText">文档中找相关证据。</text>
  <text x="615" y="414" class="cardText">优先：向量检索</text>
  <text x="615" y="446" class="cardText">备用：中文词法检索</text>

  <!-- Card 4 -->
  <circle cx="890" cy="274" r="24" fill="#6c5cc6"/>
  <text x="890" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#fff">4</text>
  <text x="930" y="282" class="cardTitle">模型生成</text>
  <text x="875" y="335" class="cardText">Ollama 本地运行</text>
  <text x="875" y="373" class="cardTitle" fill="#6c5cc6">ds-ocean_mingzhe</text>
  <text x="875" y="420" class="cardText">系统提示词 +</text>
  <text x="875" y="452" class="cardText">知识库证据 + 对话历史</text>

  <!-- Card 5 -->
  <circle cx="1150" cy="274" r="24" fill="#d45b45"/>
  <text x="1150" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#fff">5</text>
  <text x="1190" y="282" class="cardTitle">答案检查</text>
  <text x="1135" y="335" class="cardText">检查有没有：</text>
  <text x="1135" y="367" class="cardText">• 思考标签泄漏</text>
  <text x="1135" y="399" class="cardText">• 复述和重复</text>
  <text x="1135" y="431" class="cardText">• 无依据套话</text>
  <rect x="1135" y="455" width="170" height="28" rx="14" fill="#f9d6cf"/>
  <text x="1220" y="475" text-anchor="middle" class="pill" fill="#b64735">不合格就兜底</text>

  <!-- Card 6 -->
  <circle cx="1405" cy="274" r="24" fill="#3e9b4c"/>
  <text x="1405" y="282" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#fff">6</text>
  <text x="1445" y="282" class="cardTitle">展示</text>
  <text x="1390" y="345" class="cardText">文字回答</text>
  <line x1="1390" y1="366" x2="1510" y2="366" stroke="#b9dfbb" stroke-width="2"/>
  <text x="1390" y="405" class="cardText">字幕</text>
  <text x="1390" y="437" class="cardText">语音</text>
  <text x="1390" y="476" class="small">数字人只负责播报</text>

  <!-- arrows -->
  <line x1="290" y1="365" x2="325" y2="365" stroke="#4b6b83" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="550" y1="365" x2="585" y2="365" stroke="#4b6b83" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="810" y1="365" x2="845" y2="365" stroke="#4b6b83" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="365" x2="1105" y2="365" stroke="#4b6b83" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1330" y1="365" x2="1365" y2="365" stroke="#4b6b83" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- direct rule path -->
  <path d="M 440 500 L 440 555 L 1220 555 L 1220 505" fill="none" stroke="#d98a19" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="630" y="535" width="280" height="36" rx="18" fill="#fff4df" stroke="#f1d49a"/>
  <text x="770" y="559" text-anchor="middle" class="pill" fill="#a9620c">命中规则：跳过模型，直接给标准答案</text>

  <!-- fallback note -->
  <rect x="1090" y="605" width="260" height="82" rx="16" fill="#fff8ed" stroke="#f1d49a" stroke-width="2"/>
  <text x="1110" y="637" class="note">模型异常或不合格</text>
  <text x="1110" y="666" class="small">→ 使用规则答案或知识库证据</text>
  <path d="M 1220 505 L 1220 600" fill="none" stroke="#d98a19" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <!-- model preparation strip -->
  <rect x="70" y="730" width="1460" height="125" rx="20" fill="#f1f6fa" stroke="#d4e2ea" stroke-width="2"/>
  <text x="100" y="770" class="cardTitle">模型从哪里来？</text>
  <rect x="355" y="748" width="260" height="56" rx="16" fill="#e8f1fb"/>
  <text x="485" y="783" text-anchor="middle" class="cardText">海洋问答训练数据</text>
  <line x1="620" y1="776" x2="665" y2="776" stroke="#4b6b83" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="680" y="748" width="220" height="56" rx="16" fill="#fff4df"/>
  <text x="790" y="783" text-anchor="middle" class="cardText">LoRA 微调</text>
  <line x1="905" y1="776" x2="950" y2="776" stroke="#4b6b83" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="965" y="748" width="270" height="56" rx="16" fill="#e9e7fb"/>
  <text x="1100" y="783" text-anchor="middle" class="cardText">ds-ocean_mingzhe</text>
  <text x="100" y="829" class="small">训练让模型更懂海洋领域；RAG 让它回答时能引用项目最新资料。</text>
  <path d="M 1100 748 L 960 500" fill="none" stroke="#6c5cc6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>

  <!-- footer -->
  <rect x="70" y="885" width="1460" height="42" rx="21" fill="#17324d"/>
  <text x="800" y="913" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#ffffff">规则保证可靠，知识库提供依据，模型负责组织语言，数字人负责表达。</text>
</svg>
